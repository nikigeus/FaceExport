            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

        body {

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .app {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            border-radius: 42px;
            padding: 32px 36px;

            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 1px;

            margin-bottom: 28px;
            color: #ffffffd9;
            text-shadow: 0 2px 10px rgba(0, 180, 255, 0.4);
        }
        .buttons {

            gap: 24px;
            justify-content: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(20, 30, 45, 0.8);
            border: 1.5px solid rgba(0, 200, 255, 0.5);
            color: #e0f2fe;
            font-weight: 500;
            font-size: 1.15rem;
            padding: 14px 34px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.1);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        .btn:hover {
            background: rgba(30, 65, 95, 0.9);
            border-color: #4df0ff;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.5);
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .main-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
        }
        .photo-area {
            flex: 2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 32px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .preview-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 24px;
            overflow: hidden;
            background: #0b121c;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(120, 200, 255, 0.3);
            transition: border 0.2s;
        }
        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-container .placeholder {
            color: #7a8b9f;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
            opacity: 0.7;
            font-style: italic;
            user-select: none;
        }
        .video-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 24px;
            overflow: hidden;
            background: #0b121c;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid #28a0ff;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .status-bar {
            margin-top: 14px;
            font-size: 0.9rem;
            color: #a0c0e0;
            min-height: 24px;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .result-area {
            flex: 1.2;
            min-width: 220px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 32px;
            padding: 22px 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .flag-big {
            font-size: 8rem;
            line-height: 1.2;
            filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.5));

            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .flag-big img {
            width: 200px;
            height: auto;
            max-height: 140px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #0b121c;
        }
        .country-name {
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            margin-top: 12px;
            text-shadow: 0 4px 12px rgba(0, 150, 255, 0.6);
            word-break: break-word;
            letter-spacing: 0.5px;
        }
        .hash-hint {
            font-size: 0.75rem;
            color: #6f8aac;
            margin-top: 14px;
            font-family: monospace;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 40px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

        .postcard-section {

            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;

        .postcard-wrapper {
            flex: 2;
            min-width: 280px;
            display: flex;
            justify-content: center;
        }
        .postcard {
            position: relative;
            width: 100%;
            max-width: 520px;
            border-radius: 22px;
            overflow: hidden;
            background: #0b121c;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .postcard.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .postcard-photo {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #0b121c;
        }
        .postcard-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .postcard-logo {
            position: absolute;
            top: 14px;
            height: 42px;
            width: auto;
            padding: 6px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .postcard-logo svg {
            height: 100%;
            width: auto;
            display: block;
        }
        .postcard-logo.left {
            left: 14px;
        }
        .postcard-logo.right {
            right: 14px;
        }
        .postcard-footer {
            background: #ffffff;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            min-height: 74px;
        }
        .postcard-footer .flag {
            width: 56px;
            height: auto;
            max-height: 40px;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
        }
        .postcard-footer .caption {
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            line-height: 1.25;
            word-break: break-word;
        }

        /* ================= ОТПРАВКА НА EMAIL ================= */
        .send-area {
            flex: 1.2;
            min-width: 260px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 32px;
            padding: 24px 22px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 14px;
            justify-content: center;
        }
        .send-area h3 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0f2fe;
            letter-spacing: 0.4px;
        }
        .send-area p {
            margin: 0;
            font-size: 0.85rem;
            color: #8fa8c4;
            line-height: 1.4;
        }
        .email-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .email-input {
            flex: 1;
            min-width: 140px;
            background: rgba(10, 18, 28, 0.9);
            border: 1.5px solid rgba(0, 200, 255, 0.35);
            color: #e0f2fe;
            font-size: 1rem;
            padding: 12px 16px;
            border-radius: 14px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .email-input::placeholder {
            color: #6f8aac;
        }
        .email-input:focus {
            border-color: #4df0ff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
        }
        .send-btn {
            background: rgba(20, 30, 45, 0.8);
            border: 1.5px solid rgba(0, 200, 255, 0.5);
            color: #e0f2fe;
            font-weight: 500;
            font-size: 1rem;
            padding: 12px 22px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 120px;
        }
        .send-btn:hover {
            background: rgba(30, 65, 95, 0.9);
            border-color: #4df0ff;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.5);
        }
        .send-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .send-btn.success {
            background: rgba(16, 80, 50, 0.9);
            border-color: #22c55e;
            color: #bbf7d0;
            box-shadow: 0 0 18px rgba(34, 197, 94, 0.5);
            pointer-events: none;
        }
        .send-btn.success .check-icon {
            display: inline-block;
        }
        .check-icon {
            display: none;
            font-size: 1.2rem;
            line-height: 1;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>📸 Фото → Код → Страна → Открытка</h1>

    <div class="buttons">
        <button class="btn" id="uploadBtn">📂 Загрузить фото</button>
        <button class="btn" id="cameraBtn">📷 Сделать фото</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <div class="main-grid">
        <!-- Левая часть: превью фото / камера -->
        <div class="photo-area">
            <div class="preview-container" id="previewContainer">
                <div class="placeholder">📷 Фото не загружено<br><span style="font-size:0.8rem;">Загрузите или сделайте снимок</span></div>
                <img id="previewImg" class="hidden" alt="Предпросмотр">
            </div>
            <div class="video-container" id="videoContainer">
                <video id="video" autoplay playsinline></video>
            </div>
            <div class="status-bar" id="statusBar"></div>
        </div>

        <!-- Правая часть: флаг + название -->
        <div class="result-area" id="resultArea">
            <div class="flag-big" id="flagDisplay">🌍</div>
            <div class="country-name" id="countryName">—</div>
            <div class="hash-hint" id="hashHint"></div>
        </div>
    </div>

    <!-- ОТКРЫТКА + ОТПРАВКА НА EMAIL -->
    <div class="postcard-section">
        <div class="postcard-wrapper">
            <div class="postcard" id="postcard">
                <div class="postcard-photo">
                    <img id="postcardPhoto" alt="Открытка" crossorigin="anonymous">
                    <!-- Логотип конференции Export Online'26 (слева сверху) -->
                    <div class="postcard-logo left" title="Export Online'26">
                        <svg viewBox="0 0 190 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Export Online 26">
                            <rect x="0" y="4" width="182" height="32" rx="8" fill="#0b3d91"/>
                            <text x="12" y="26" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">EXPORT ONLINE</text>
                            <text x="148" y="26" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffd54a">'26</text>
                        </svg>
                    </div>
                    <!-- Логотип Российского экспортного центра (справа сверху) -->
                    <div class="postcard-logo right" title="Российский экспортный центр">
                        <svg viewBox="0 0 210 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Российский экспортный центр">
                            <rect x="0" y="4" width="202" height="32" rx="8" fill="#ffffff"/>
                            <circle cx="22" cy="20" r="11" fill="#d52b1e"/>
                            <path d="M22 11 L25 18 L32 18 L26.5 22.5 L28.5 29 L22 25 L15.5 29 L17.5 22.5 L12 18 L19 18 Z" fill="#ffffff"/>
                            <text x="42" y="18" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0b3d91">РОССИЙСКИЙ</text>
                            <text x="42" y="29" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0b3d91">ЭКСПОРТНЫЙ ЦЕНТР</text>
                        </svg>
                    </div>
                </div>
                <div class="postcard-footer">
                    <img class="flag" id="postcardFlag" alt="Флаг" crossorigin="anonymous">
                    <div class="caption" id="postcardCaption">Я экспортирую в …</div>
                </div>
            </div>
        </div>

        <div class="send-area" id="sendArea">
            <h3>✉️ Отправить открытку себе</h3>
            <p>Введите email — и мы отправим открытку с рекомендованной страной.</p>
            <div class="email-row">
                <input type="email" class="email-input" id="emailInput" placeholder="you@example.com" autocomplete="email">
                <button class="send-btn" id="sendBtn">
                    <span class="send-label">Отправить</span>
                    <span class="check-icon">✔</span>
                </button>
            </div>
            <div class="status-bar" id="sendStatus" style="margin-top:0; min-height:18px; text-align:left;"></div>
        </div>
    </div>
</div>

<script>

        const uploadBtn = document.getElementById('uploadBtn');
        const cameraBtn = document.getElementById('cameraBtn');

        const previewContainer = document.getElementById('previewContainer');

        const flagDisplay = document.getElementById('flagDisplay');

        const postcardFlag = document.getElementById('postcardFlag');

            statusBar.textContent = text || '';
            statusBar.style.color = isError ? '#ff9f9f' : '#a0c0e0';
        }

        function resetResult() {
            flagDisplay.innerHTML = '🌍';
            countryName.textContent = '—';
            hashHint.textContent = '';
            lastCountry = null;
            resetPostcard();

            postcardPhoto.removeAttribute('src');
            postcardFlag.removeAttribute('src');
            postcardCaption.textContent = 'Я экспортирую в …';
        }

        function resetSendState() {
            sendBtn.classList.remove('success');
            sendLabel.textContent = 'Отправить';
            sendStatus.textContent = '';
            sendStatus.style.color = '#a0c0e0';
            emailInput.value = '';
        }

        function imageToCode(imgElement) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const w = 32, h = 32;
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(imgElement, 0, 0, w, h);
                const imageData = ctx.getImageData(0, 0, w, h).data;
                let sum = 0;
                for (let i = 0; i < imageData.length; i++) {
                    sum += imageData[i];
                }
                const normalized = (sum % 1000) / 1000;
                const hashStr = (sum % 100000000).toString().padStart(8, '0');
                resolve({ normalized, hashStr, sum });
            });
        }

        function pickCountryByCode(code) {
            const index = Math.floor(code * COUNTRIES.length) % COUNTRIES.length;
            return COUNTRIES[index];
        }

        function buildPostcard(photoSrc, country) {
            if (!photoSrc || !country) return;
            postcardPhoto.src = photoSrc;
            postcardFlag.src = `https://flagcdn.com/w160/${country.code}.png`;
            postcardFlag.alt = `Флаг: ${country.name}`;
            postcardCaption.textContent = `Я экспортирую в ${country.name}`;
            postcard.classList.add('visible');
            resetSendState();
        }

        async function processImageFromElement(imgElement, sourceSrc) {
            if (processing) return;
            processing = true;
            setStatus('🔍 Анализ изображения...');

            try {
                if (imgElement.tagName === 'IMG' && !imgElement.complete) {
                    await new Promise((resolve) => {
                        imgElement.onload = resolve;
                        imgElement.onerror = resolve;
                    });
                }

                const { normalized, hashStr } = await imageToCode(imgElement);
                const country = pickCountryByCode(normalized);
                lastCountry = country;

                flagDisplay.innerHTML = `<img src="https://flagcdn.com/w320/${country.code}.png" alt="${country.name}" loading="lazy">`;
                countryName.textContent = country.name;
                hashHint.textContent = `код: ${hashStr} → ${normalized.toFixed(3)}`;

                const photoSrc = sourceSrc || (imgElement.tagName === 'IMG' ? imgElement.src : null);
                if (photoSrc) {
                    buildPostcard(photoSrc, country);
                }

                setStatus(`✅ Определена страна: ${country.name}`);
            } catch (err) {
                console.error(err);
                setStatus('❌ Ошибка при обработке изображения', true);
                resetResult();
            } finally {
                processing = false;
            }
        }

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                setStatus('❌ Пожалуйста, выберите изображение', true);
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                previewImg.src = dataUrl;
                previewImg.classList.remove('hidden');
                const placeholder = previewContainer.querySelector('.placeholder');
                if (placeholder) placeholder.style.display = 'none';

                stopCamera();

                previewImg.onload = () => {
                    processImageFromElement(previewImg, dataUrl);
                };
                if (previewImg.complete) {
                    processImageFromElement(previewImg, dataUrl);
                }
            };
            reader.readAsDataURL(file);
            setStatus('📂 Фото загружено');
        }

        // ---------- Камера ----------
        async function startCamera() {
            if (stream) stopCamera();
            try {
                setStatus('🎥 Запрос доступа к камере...');
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                videoContainer.style.display = 'flex';
                previewContainer.style.display = 'none';
                currentMode = 'camera';
                setStatus('📸 Нажмите "Сделать фото" ещё раз, чтобы снять кадр');
                cameraBtn.textContent = '📸 Снять кадр';
                cameraBtn.removeEventListener('click', startCamera);
                cameraBtn.addEventListener('click', capturePhoto);
            } catch (err) {
                console.error(err);
                setStatus('❌ Не удалось получить доступ к камере', true);
                stopCamera();
            }
        }

        function capturePhoto() {
            if (!stream || !video.videoWidth) {
                setStatus('❌ Камера не готова', true);
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg');
            previewImg.src = dataUrl;
            previewImg.classList.remove('hidden');

            previewContainer.style.display = 'flex';
            videoContainer.style.display = 'none';

            const placeholder = previewContainer.querySelector('.placeholder');
            if (placeholder) placeholder.style.display = 'none';

            stopCamera();

            if (previewImg.complete) {
                processImageFromElement(previewImg, dataUrl);
            } else {
                previewImg.onload = () => processImageFromElement(previewImg, dataUrl);
            }

            setStatus('📷 Фото сделано');
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoContainer.style.display = 'none';
            previewContainer.style.display = 'flex';
            cameraBtn.textContent = '📷 Сделать фото';
            cameraBtn.removeEventListener('click', capturePhoto);
            cameraBtn.addEventListener('click', startCamera);
            currentMode = 'idle';
        }

        function resetAll() {
            stopCamera();
            previewImg.src = '';
            previewImg.classList.add('hidden');
            const placeholder = previewContainer.querySelector('.placeholder');
            if (placeholder) placeholder.style.display = 'block';
            resetResult();
            resetSendState();
            setStatus('Готово к загрузке');
            fileInput.value = '';
        }

        // ---------- Отправка ----------
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        async function uploadToImageBan(imageDataUrl) {
            const SECRET_KEY = 'XX7T7VcZtIET2banpnspCGt0QZ89Gu0Fve5'; // Ваш ключ
            const blob = await (await fetch(imageDataUrl)).blob();

            const formData = new FormData();
            formData.append('image', blob, 'postcard.jpg');

            const response = await fetch('https://api.imageban.ru/v1', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${SECRET_KEY}` },
                body: formData
            });

            if (!response.ok) throw new Error('Ошибка загрузки в ImageBan');
            const result = await response.json();
            if (!result.success) throw new Error(result.error?.message || 'Неизвестная ошибка ImageBan');

            return result.data.link;
        }

        async function sendPostcard() {
            const email = emailInput.value.trim();

            if (!lastCountry) {
                sendStatus.textContent = 'Сначала загрузите фото — открытка ещё не сформирована.';
                sendStatus.style.color = '#ff9f9f';
                return;
            }

            if (!isValidEmail(email)) {
                sendStatus.textContent = 'Введите корректный email.';
                sendStatus.style.color = '#ff9f9f';
                return;
            }

            sendBtn.disabled = true;
            sendLabel.textContent = 'Готовим...';
            sendStatus.textContent = 'Собираем вашу открытку...';
            sendStatus.style.color = '#a0c0e0';

            try {
                // Делаем снимок блока открытки
                const canvas = await html2canvas(postcard, {
                    useCORS: true, // Обязательно для загрузки флага с другого домена
                    scale: 2, // Увеличиваем разрешение
                    backgroundColor: null // Прозрачный фон, если нужно
                });
                
                const postcardDataUrl = canvas.toDataURL('image/png');

                sendLabel.textContent = 'Загрузка...';
                sendStatus.textContent = 'Сохраняем открытку...';
                
                // Загружаем в ImageBan уже сгенерированную картинку
                const postcardUrl = await uploadToImageBan(postcardDataUrl);

                const templateParams = {
                    to_email: email,
                    country_name: lastCountry.name,
                    country_code: lastCountry.code,
                    postcard_link: postcardUrl
                };

                sendLabel.textContent = 'Отправка...';
                sendStatus.textContent = 'Отправляем письмо...';

                // Замените на свои ID из EmailJS
                await emailjs.send('service_zccm7qr', 'template_e1di81m', templateParams);

                sendBtn.classList.add('success');
                sendBtn.disabled = false;
                sendLabel.textContent = '';
                sendStatus.textContent = `Открытка отправлена на ${email}`;
                sendStatus.style.color = '#86efac';
                emailInput.value = '';

            } catch (error) {
                console.error(error);
                sendBtn.disabled = false;
                sendLabel.textContent = 'Отправить';
                sendStatus.textContent = 'Ошибка отправки. Попробуйте ещё раз.';
                sendStatus.style.color = '#ff9f9f';
            }
        }

        // ---------- Обработчики ----------
        uploadBtn.addEventListener('click', () => {
            if (currentMode === 'camera') stopCamera();
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
            fileInput.value = '';
        });

        cameraBtn.addEventListener('click', startCamera);
        sendBtn.addEventListener('click', sendPostcard);
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendPostcard();
            }
        });

        resetAll();

        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
        });
    })();
</script>
</body>
</html>
